<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Impact360 SAV Runner</title>
<link rel="stylesheet" href="fonts/fonts.css?v={{v}}">
<link rel="stylesheet" href="style.css?v={{v}}">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">I²R</span> Impact360 · הרצת ממצאים מקובץ SAV</div>
  <nav>
    <button class="link" id="nav-home">פרויקט חדש / קיימים</button>
    <button class="link" id="nav-lib">ספרייה (תבניות ומילון)</button>
    <button class="link" id="nav-user" title="שם המשתמש נרשם ביומן ההחלטות"></button>
  </nav>
</header>

<ol class="steps" id="steps">
  <li data-step="1">1 · פרויקט</li>
  <li data-step="2">2 · סקירה</li>
  <li data-step="3">3 · הרצה</li>
  <li data-step="4">4 · שמירה כתבנית</li>
</ol>

<main id="main"></main>
<div id="toast" role="status" aria-live="polite"></div>

<footer class="foot" id="foot">טוען גרסה…</footer>
<script src="app.js?v={{v}}"></script>
</body>
</html>
